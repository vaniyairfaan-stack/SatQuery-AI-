<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SatQuery AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🛰️ SatQuery AI</h1>

        <p class="subtitle">
            Interactive AI assistant for multimodal remote sensing image analysis.
        </p>

        <div class="card">

            <h2>Ask SatQuery AI</h2>

            <h3>🛰️ Upload Satellite Image</h3>

<input
    type="file"
    id="imageInput"
    accept="image/*"
>

<img
    id="imagePreview"
    style="display:none; width:100%; max-width:600px; margin-top:15px; border-radius:12px;"
>
            <input
                id="queryInput"
                type="text"
                placeholder="Ask about this satellite image..."
            >

            <button id="analyzeBtn">
                Analyze Image
            </button>

            <div id="result" class="result">
                Your analysis will appear here.
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
