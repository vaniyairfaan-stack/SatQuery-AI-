<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SatQuery AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <h1>🛰️ SatQuery AI</h1>

        <p class="subtitle">
            Interactive AI assistant for multimodal remote sensing image analysis.
        </p>

        <div class="card">
            <h2>Ask SatQuery AI</h2>

            <input
                type="text"
                placeholder="Ask about this satellite image..."
            >

            <button>Analyze Image</button>

            <div class="result">
                Your analysis will appear here.
            </div>
        </div>
    </div>

</body>
</html>
